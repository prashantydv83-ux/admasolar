name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch images if missing
        run: |
          mkdir -p images
          UA="Mozilla/5.0 (compatible; ADMASolarBot/1.0)"
          get() {
            if [ ! -s "$1" ]; then
              curl -fsSL -A "$UA" -o "$1" "$2" || rm -f "$1"
            fi
          }
          get images/adma-logo.webp "https://admasolar.com/new/assets/icons/adma.webp"
          get images/grid.webp "https://admasolar.com/new/assets/images/grid.webp"
          get images/battery-solar.webp "https://admasolar.com/new/assets/images/battery-solar.webp"
          get images/rooftop-home.jpg "https://images.unsplash.com/photo-1508514177221-188b1cf16e9d?auto=format&fit=crop&w=1600&q=80"
          get images/industrial-roof.jpg "https://images.unsplash.com/photo-1545208942-e1c9c916524b?auto=format&fit=crop&w=1600&q=80"
          get images/storage.jpg "https://images.unsplash.com/photo-1509391366360-2e959784a276?auto=format&fit=crop&w=1600&q=80"
          get images/modules.jpg "https://images.unsplash.com/photo-1509391366360-2e959784a276?auto=format&fit=crop&w=1200&q=80"
          get images/studio.jpg "https://images.unsplash.com/photo-1497366216548-37526070297c?auto=format&fit=crop&w=1600&q=80"
          get images/hero-desert.jpg "https://images.unsplash.com/photo-1509391366360-2e959784a276?auto=format&fit=crop&w=1600&q=80"
          if [ -s images/adma-logo.webp ]; then cp images/adma-logo.webp images/logo-official.png || true; fi
          ls -la images || true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
